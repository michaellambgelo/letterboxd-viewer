name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_last.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify webhook URL
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Error: DISCORD_WEBHOOK_URL is not set"
            exit 1
          fi
          echo "DISCORD_WEBHOOK_URL is set"
      
      - name: Inject webhook URL
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Create the script tag with proper escaping and explicit var declaration
          SCRIPT='<script>var DISCORD_WEBHOOK_URL = `'
          SCRIPT+="$WEBHOOK_URL"
          SCRIPT+='`; window.DISCORD_WEBHOOK_URL = DISCORD_WEBHOOK_URL;</script>'
          
          # Insert after title tag and verify — every page with the guestbook footer
          for page in index.html rolodex.html network.html tags.html rewatches.html; do
            perl -i -pe "s|</title>|\$&\n\t\t$SCRIPT|" "$page"

            echo "Verifying webhook URL injection in $page..."
            if ! grep -q "DISCORD_WEBHOOK_URL =" "$page"; then
              echo "Error: Failed to inject webhook URL into $page"
              exit 1
            fi
            echo "Successfully injected webhook URL into $page"

            # Show the modified section (URL hidden)
            echo "Modified section of $page (URL hidden):"
            grep -A 1 -B 1 "DISCORD_WEBHOOK_URL" "$page" | sed 's|`https://[^`]*`|[WEBHOOK_URL_HIDDEN]|'
          done
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # deploy-pages asks the internal Actions Results service for the
      # artifact once, with no retry, a fraction of a second after the upload
      # is finalized. That service can lag (actions/deploy-pages#451), and the
      # deploy then fails with 'No artifacts named "github-pages" were found'.
      # The public REST listing is a different backend and shows the artifact
      # before the internal one does, so polling it doesn't help (tried).
      # Give it a moment, then retry the deploy step itself.
      - name: Let the artifact become visible
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the last retry
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (last retry)
        id: deployment_last
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
