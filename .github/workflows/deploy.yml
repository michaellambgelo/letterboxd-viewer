name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify webhook URL
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "Error: DISCORD_WEBHOOK_URL is not set"
            exit 1
          fi
          echo "DISCORD_WEBHOOK_URL is set"
      
      - name: Inject webhook URL
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Create the script tag with proper escaping and explicit var declaration
          SCRIPT='<script>var DISCORD_WEBHOOK_URL = `'
          SCRIPT+="$WEBHOOK_URL"
          SCRIPT+='`; window.DISCORD_WEBHOOK_URL = DISCORD_WEBHOOK_URL;</script>'
          
          # Insert after title tag and verify — every page with the guestbook footer
          for page in index.html rolodex.html network.html tags.html rewatches.html; do
            perl -i -pe "s|</title>|\$&\n\t\t$SCRIPT|" "$page"

            echo "Verifying webhook URL injection in $page..."
            if ! grep -q "DISCORD_WEBHOOK_URL =" "$page"; then
              echo "Error: Failed to inject webhook URL into $page"
              exit 1
            fi
            echo "Successfully injected webhook URL into $page"

            # Show the modified section (URL hidden)
            echo "Modified section of $page (URL hidden):"
            grep -A 1 -B 1 "DISCORD_WEBHOOK_URL" "$page" | sed 's|`https://[^`]*`|[WEBHOOK_URL_HIDDEN]|'
          done
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # deploy-pages looks the artifact up through the REST API a fraction of
      # a second after the upload is finalized. That listing can lag, and the
      # deploy then fails with 'No artifacts named "github-pages" were found'.
      # Wait until the listing shows it (up to ~60s) before deploying.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "Artifact listed after $attempt check(s)"
              exit 0
            fi
            sleep 3
          done
          echo "Artifact still not listed after 60s; trying the deploy anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
