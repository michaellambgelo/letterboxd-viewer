name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

jobs:
  pipeline:
    name: Python pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest
      - run: python -m pytest scripts/ -q

  worker:
    name: Worker (node test.mjs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
